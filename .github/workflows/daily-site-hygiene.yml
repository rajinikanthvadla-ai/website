name: Daily site hygiene

on:
  schedule:
    # 6:00 AM IST (00:30 UTC) — sync YouTube + publish AI article
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the article (leave empty for auto-pick)"
        required: false
        type: string
      skip_article:
        description: "Skip article generation (YouTube sync only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest YouTube videos
        run: node scripts/sync-youtube-videos.mjs

      - name: Generate daily AI article
        if: ${{ inputs.skip_article != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.js "${{ github.event.inputs.topic || '' }}"

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/youtube-videos.json content/articles.json
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "Daily site hygiene: sync YouTube videos and AI article"
            git push
          fi
